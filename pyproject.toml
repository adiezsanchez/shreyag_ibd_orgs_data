[project]
description = "A starter template for marimo notebooks with pixi"
name = "marimo-template"
requires-python = ">=3.10"
version = "0.1.0"

[tool.pixi.project]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.pypi-dependencies]
marimo-template = { path = ".", editable = true }

[tool.pixi.dependencies]
pre-commit = ">=4.1.0,<5"
pre-commit-hooks = ">=5,<6"
pytest = ">=9,<10"
ruff = ">=0.15,<0.16"
marimo = ">=0.23.6,<0.24"
pandas = ">=3.0.3,<4"
seaborn = ">=0.13.2,<0.14"
plotly = ">=6.6.0,<7"
tqdm = ">=4.67.3,<5"
polars = ">=1.41.2,<2"
pyarrow = ">=24.0.0,<25"
scikit-learn = ">=1.7.2,<2"
umap-learn = ">=0.5.9.post2,<0.6"
python-igraph = ">=1.0.0,<2"
leidenalg = ">=0.11.0,<0.12"

[tool.pixi.tasks]
edit = "marimo edit src/app.py"
correlation_plots = "marimo run src/app.py"
density_plots = "marimo run src/app2.py"
dimensionality_reduction_clustering = "marimo run src/app3.py"
test = "pytest"
lint = "ruff check src"
format = "ruff format src"
pre-commit-install = "pre-commit install"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "marimo_template"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", # pycodestyle
  "F", # pyflakes
  "I", # isort
  "B", # flake8-bugbear
]

[tool.marimo.ai]
rules = "- prefer polars over pandas\n- make charts using altair"

[tool.marimo.save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = true

[tool.marimo.package_management]
manager = "pixi"
